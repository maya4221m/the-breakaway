
<!DOCTYPE html>
<html>
<head>
    <title>The Breakaway</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        /* ---------------- BACKGROUND ---------------- */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #07131f;
            background-image:
                radial-gradient(
                    ellipse at top,
                    rgba(28, 75, 110, 0.18),
                    transparent 65%
                ),
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0.012) 0px,
                    rgba(255, 255, 255, 0.012) 1px,
                    transparent 1px,
                    transparent 3px
                ),
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.01) 0px,
                    rgba(255, 255, 255, 0.01) 1px,
                    transparent 1px,
                    transparent 4px
                );
            color: white;
            text-align: center;
        }

        /* ---------------- GAME SCREEN ---------------- */

        .screen {
            display: none;
            min-height: 100vh;
            padding: 40px 20px;
        }

        #gameScreen {
            display: block;
        }

        .top {
            max-width: 900px;
            margin: auto;
        }

        .league {
            letter-spacing: 5px;
            font-size: 14px;
            color: #8fa7b8;
        }

        h1 {
            font-size: 55px;
            margin: 10px 0;
            letter-spacing: 3px;
        }

        .subtitle {
            color: #b8c7d1;
            font-size: 18px;
        }

        /* ---------------- SCOREBOARD ---------------- */

        .scoreboard {
            width: 500px;
            max-width: 90%;
            margin: 30px auto;
            background: #111d29;
            border: 2px solid #34495a;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .team {
            font-size: 14px;
            color: #9eb1bf;
        }

        .score {
            font-size: 35px;
            font-weight: bold;
        }

        .time {
            color: #e63946;
            font-size: 22px;
            font-weight: bold;
        }

        /* ---------------- ICE RINK ---------------- */

        .rink {
            width: 800px;
            max-width: 95%;
            height: 350px;
            margin: 30px auto;
            background: #eef7fa;
            border: 8px solid white;
            border-radius: 180px;
            position: relative;
            overflow: hidden;
        }

        .center-line {
            position: absolute;
            width: 6px;
            height: 100%;
            background: #d9363e;
            left: 50%;
            transform: translateX(-50%);
        }

        .blue-line-left,
        .blue-line-right {
            position: absolute;
            width: 7px;
            height: 100%;
            background: #2674b8;
        }

        .blue-line-left {
            left: 25%;
        }

        .blue-line-right {
            right: 25%;
        }

        .circle {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 4px solid #d9363e;
            border-radius: 50%;
            top: 125px;
        }

        .circle.left {
            left: 90px;
        }

        .circle.right {
            right: 90px;
        }

        /* ---------------- PLAYER ---------------- */

        .player {
            position: absolute;
            left: 160px;
            top: 135px;
            font-size: 55px;
        }

        /* ---------------- PUCK ---------------- */

        .puck {
            position: absolute;
            left: 225px;
            top: 190px;
            width: 18px;
            height: 8px;
            background: #111;
            border-radius: 50%;
        }

        /* ---------------- GOALS AND NETS ---------------- */

        .goal {
            position: absolute;
            top: 105px;
            width: 65px;
            height: 140px;
            border-top: 7px solid #d9363e;
            border-bottom: 7px solid #d9363e;
            z-index: 2;
        }

        .goal-left {
            left: 15px;
            border-left: 7px solid #d9363e;
            border-right: none;
        }

        .goal-right {
            right: 15px;
            border-right: 7px solid #d9363e;
            border-left: none;
        }

        .net {
            position: absolute;
            top: 112px;
            width: 45px;
            height: 126px;
            background:
                repeating-linear-gradient(
                    45deg,
                    transparent 0px,
                    transparent 6px,
                    #c8d3d9 7px,
                    transparent 8px
                ),
                repeating-linear-gradient(
                    -45deg,
                    transparent 0px,
                    transparent 6px,
                    #c8d3d9 7px,
                    transparent 8px
                );
            border: none;
            z-index: 1;
        }

        .net-left {
            left: 15px;
            right: auto;
        }

        .net-right {
            right: 15px;
            left: auto;
        }

        /* ---------------- BUTTONS ---------------- */

        .choices {
            margin-top: 25px;
        }

        button {
            background: #123b5d;
            color: white;
            border: 2px solid #4e7b9d;
            padding: 16px 35px;
            margin: 8px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #1d6595;
            border-color: white;
        }

        /* ---------------- RESULT SCREEN ---------------- */

        #resultScreen {
            background-color: #07131f;
            background-image:
                radial-gradient(
                    circle at center,
                    rgba(22, 70, 106, 0.35),
                    transparent 70%
                ),
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0.012) 0px,
                    rgba(255, 255, 255, 0.012) 1px,
                    transparent 1px,
                    transparent 3px
                ),
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.01) 0px,
                    rgba(255, 255, 255, 0.01) 1px,
                    transparent 1px,
                    transparent 4px
                );
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .result-box {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .result-label {
            letter-spacing: 5px;
            color: #8fa7b8;
            font-size: 14px;
        }

        #result {
            font-size: 50px;
            font-weight: bold;
            margin: 35px 0;
        }

        /* RESULT COLOURS */

        .goal-result {
            color: #39d353;
        }

        .miss-result {
            color: #e63946;
        }

        .timeout-result {
            color: white;
        }

        /* PLAY AGAIN BUTTON */

        .play-again {
            background: #d9363e;
            border-color: #d9363e;
            padding: 18px 45px;
        }

        .play-again:hover {
            background: #ef5350;
        }

        /* ---------------- MOBILE ---------------- */

        @media (max-width: 600px) {
            .screen {
                padding: 25px 10px;
            }

            h1 {
                font-size: 36px;
            }

            .league {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .rink {
                height: 260px;
                border-radius: 130px;
            }

            .circle {
                width: 70px;
                height: 70px;
                top: 90px;
            }

            .circle.left {
                left: 50px;
            }

            .circle.right {
                right: 50px;
            }

            .goal {
                top: 75px;
                width: 40px;
                height: 110px;
                border-top-width: 5px;
                border-bottom-width: 5px;
            }

            .goal-left {
                left: 8px;
                border-left-width: 5px;
            }

            .goal-right {
                right: 8px;
                border-right-width: 5px;
            }

            .net {
                top: 82px;
                width: 27px;
                height: 96px;
            }

            .net-left {
                left: 8px;
            }

            .net-right {
                right: 8px;
            }

            .player {
                left: 23%;
                top: 95px;
                font-size: 40px;
            }

            .puck {
                left: 34%;
                top: 145px;
            }

            #result {
                font-size: 34px;
            }

            button {
                padding: 14px 22px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= GAME SCREEN ================= -->

    <div id="gameScreen" class="screen">
        <div class="top">

            <div class="league">
                REGULATION 3RD PERIOD
            </div>

            <h1>THE BREAKAWAY</h1>

            <p class="subtitle">
                One chance. One goalie. What do you do?
            </p>

            <!-- SCOREBOARD -->

            <div class="scoreboard">

                <div>
                    <div class="team">HOME</div>
                    <div class="score">2</div>
                </div>

                <div>
                    <div class="time" id="timer">00:20</div>
                </div>

                <div>
                    <div class="team">AWAY</div>
                    <div class="score">2</div>
                </div>

            </div>

            <!-- HOCKEY RINK -->

            <div class="rink">

                <div class="blue-line-left"></div>
                <div class="center-line"></div>
                <div class="blue-line-right"></div>

                <div class="circle left"></div>
                <div class="circle right"></div>

                <div class="player"></div>
                <div class="puck"></div>

                <!-- LEFT GOAL -->

                <div class="net net-left"></div>
                <div class="goal goal-left"></div>

                <!-- RIGHT GOAL -->

                <div class="net net-right"></div>
                <div class="goal goal-right"></div>

            </div>

            <h2>YOU'RE IN ALONE.</h2>

            <p>Choose your move before the clock hits zero.</p>

            <div class="choices">

                <button onclick="play('shoot')">
                    SHOOT
                </button>

                <button onclick="play('deke')">
                    DEKE
                </button>

                <button onclick="play('backhand')">
                    BACKHAND
                </button>

            </div>

        </div>
    </div>

    <!-- ================= RESULT SCREEN ================= -->

    <div id="resultScreen" class="screen">

        <div class="result-box">

            <div class="result-label">
                FINAL RESULT
            </div>

            <div id="result" class="timeout-result"></div>

            <button class="play-again" onclick="restart()">
                PLAY AGAIN
            </button>

        </div>

    </div>

    <script>

        /* ---------------- TIMER ---------------- */

        let timeLeft = 20;
        let timer;
        let gameOver = false;

        function showResult(message, resultClass) {
            const resultElement = document.getElementById("result");

            resultElement.textContent = message;
            resultElement.className = resultClass;

            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("resultScreen").style.display = "flex";
        }

        function startTimer() {

            clearInterval(timer);

            timeLeft = 20;
            gameOver = false;

            document.getElementById("timer").textContent = "00:20";

            timer = setInterval(function() {

                timeLeft--;

                let seconds = timeLeft.toString().padStart(2, "0");

                document.getElementById("timer").textContent =
                    "00:" + seconds;

                /* TIME'S UP */

                if (timeLeft <= 0) {

                    clearInterval(timer);
                    gameOver = true;

                    showResult("TIME'S UP!", "timeout-result");
                }

            }, 1000);
        }

        /* ---------------- GAME ---------------- */

        function play(choice) {

            if (gameOver) {
                return;
            }

            clearInterval(timer);
            gameOver = true;

            let outcomes = [];

            /* SHOOT */

            if (choice === "shoot") {

                outcomes = [
                    "GOAL! TOP SHELF!",
                    "SAVED! WHAT A STOP!",
                    "POST! SO CLOSE!",
                    "MISS! YOU BLEW IT!"
                ];

            }

            /* DEKE */

            if (choice === "deke") {

                outcomes = [
                    "GOAL! WHAT A DANGLE!",
                    "SAVED! THE GOALIE READ YOU!",
                    "YOU LOST THE PUCK!"
                ];

            }

            /* BACKHAND */

            if (choice === "backhand") {

                outcomes = [
                    "GOAL! BACKHAND BEAUTY!",
                    "SAVED! THE GOALIE GOT THE PAD DOWN!",
                    "JUST WIDE! SO CLOSE!",
                    "BLOCKED! THE GOALIE STOOD TALL!"
                ];

            }

            /* PICK RANDOM RESULT */

            let randomNumber = Math.floor(
                Math.random() * outcomes.length
            );

            let resultText = outcomes[randomNumber];

            /* SET RESULT COLOUR */

            if (resultText.startsWith("GOAL!")) {

                showResult(resultText, "goal-result");

            } else {

                showResult(resultText, "miss-result");

            }
        }

        /* ---------------- RESTART ---------------- */

        function restart() {

            document.getElementById("resultScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";

            startTimer();
        }

        /* ---------------- START GAME ---------------- */

        startTimer();

    </script>

</body>
</html>
